<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}.pbar{height:8px;border-radius:6px;background:#e5e7eb;overflow:hidden;margin:4px 0 6px}.pbar i{display:block;height:100%;background:#2e7d32;transition:width .4s}
</style></head><body><title>Fiches pédagogiques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Concept : un atelier de préparation à gauche (étapes), la fiche A4 telle qu'elle sera imprimée à droite ou en dernière étape.
   Couleurs reprises des fiches modèles : bleu d'en-tête de tableau, brun du pied de page, rouge des titres de thème. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#1b2433; --muted:#5b6678; --line:#d3dae6; --field:#f7f9fc;
  --accent:#2f5597; --accent-ink:#ffffff; --accent-soft:#e3ebf8; --brown:#7f4a1d; --danger:#b42318; --ok:#1a7f4b;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-paper:"Bookman Old Style","ITC Bookman","URW Bookman","URW Bookman L",Bookman,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1a2030; --ink:#e6eaf2; --muted:#98a3b8; --line:#2d3649; --field:#141a27;
  --accent:#8fb0ee; --accent-ink:#0e1524; --accent-soft:#222c44; --brown:#c8935c; --danger:#ff8a7a; --ok:#59c58a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1a2030; --ink:#e6eaf2; --muted:#98a3b8; --line:#2d3649; --field:#141a27;
  --accent:#8fb0ee; --accent-ink:#0e1524; --accent-soft:#222c44; --brown:#c8935c; --danger:#ff8a7a; --ok:#59c58a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 60px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding-block:6px 14px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button,.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.save-state{font-size:12px;color:var(--ok)}.save-state.bad{color:var(--danger)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:4px 16px}
.tabs button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.tabs button span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card>h2{font-size:16px;margin-bottom:12px}
.card>h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-weight:400;font-size:14.5px}
textarea{resize:vertical;line-height:1.4;min-height:40px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.btn.alt{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.note.warn{background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar b{font-size:12px;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.06em}
.bar button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 9px;cursor:pointer;min-width:32px}
@media (max-width:700px){.bar{position:static}}
.cap-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:10px;align-items:start;margin-bottom:10px}
@media (max-width:700px){.cap-row{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}}
details.seance{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
details.seance>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.seance>summary::-webkit-details-marker{display:none}
details.seance>summary::after{content:"▾";color:var(--muted)}
details.seance[open]>summary::after{content:"▴"}
details.seance .inner{padding:0 16px 16px;display:grid;gap:14px}
.moment{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field)}
.moment h4{margin:0 0 8px;font-size:13px}
.moment .grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--field)}
.thumb{max-height:110px;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.list-item{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0}
.list-item:last-child{border-bottom:none}
.list-item .t{font-weight:600}
.status{min-height:22px;font-size:13.5px}
#topflash{position:fixed;top:0;left:0;right:0;z-index:9999;display:none;align-items:center;gap:10px;padding:11px 16px;background:#1d4ed8;color:#fff;font:600 15px/1.3 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:pointer}
#topflash.err{background:#b91c1c}
#topflash .sp{flex:none;width:16px;height:16px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:tfspin .8s linear infinite}
#topflash.done .sp,#topflash.err .sp{display:none}
@keyframes tfspin{to{transform:rotate(360deg)}}
.status.err{color:var(--danger)}
.welcome{max-width:520px;margin:6vh auto 0}
.welcome h1{font-size:26px;margin-bottom:6px}
/* feuille A4 */
.sheet-wrap{overflow-x:auto;background:color-mix(in srgb,var(--muted) 18%,var(--bg));border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.paper{width:794px;height:1123px;background:#fff;color:#000;position:relative;font:16px/1.27 var(--f-paper);padding:36px 40px 0;overflow:hidden;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25);color-scheme:light}
.paper .foot{position:absolute;left:40px;right:40px;bottom:24px;border-top:2px solid #7f4a1d;padding-top:5px;display:flex;justify-content:space-between;gap:12px;font-size:13.33px}
.paper .foot b{font-weight:700}.paper .foot .pg{font-weight:700;font-size:12px;white-space:nowrap}
.paper .blk{padding-bottom:var(--gap,8px)}
.paper .ln{min-height:1.1em;overflow-wrap:anywhere}
.paper .tb{width:100%;border-collapse:collapse;table-layout:fixed}
.paper .tb td{border:1px solid #000;padding:2px 4px;vertical-align:top}
.paper .tb.thick{border:2px solid #000}
.paper .tb.nb td{border:none}
.paper .tb td.sm{font-size:16px;line-height:1.27}
.paper .tb td.just .ln{text-align:justify}
.paper u{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-size:100% 1.3px;background-position:0 94%;padding-bottom:0;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper .box{border:1px solid #000;padding:0 4px}
.paper img{display:block;margin:4px auto}
.paper .katex{font-size:1.02em}
.paper-measure{position:absolute;left:-10000px;top:0;width:714px;font:16px/1.27 var(--f-paper);visibility:hidden}
.paper-measure .tb{width:100%;border-collapse:collapse;table-layout:fixed}
.paper-measure .tb td{border:1px solid #000;padding:2px 4px;vertical-align:top}
.paper-measure .tb td.sm{font-size:16px;line-height:1.27}
.paper-measure .tb.thick{border:2px solid #000}
.paper-measure .blk{padding-bottom:var(--gap,8px)}
.paper-measure .ln{min-height:1.1em;overflow-wrap:anywhere}
.paper-measure .box{border:1px solid #000;padding:0 4px}
.paper-measure img{display:block;margin:4px auto}
.paper-measure .katex{font-size:1.02em}
.paper,.paper-measure{font-size:calc(16px*var(--k,1));line-height:var(--lh,1.27)}
.paper img,.paper-measure img{zoom:var(--k,1)}
.paper .tb td.sm,.paper-measure .tb td.sm{font-size:calc(16px*var(--k,1))}
.paper .blk,.paper-measure .blk{padding-bottom:calc(var(--gap,8px)*var(--k,1))}
.export-stage{position:fixed;left:-12000px;top:0}

function progRows(items){
  const rows=[]; const sorted=items.filter(it=>String(it.s).trim()).sort((a,b)=>a.y-b.y);
  for(const it of sorted){
    const tol=Math.max(2.5,(it.h||8)*0.45);
    let r=rows.find(r=>Math.abs(r.y-it.y)<=tol);
    if(!r){r={y:it.y,its:[]};rows.push(r)}

  rows.sort((a,b)=>a.y-b.y);
  rows.forEach(r=>{r.its.sort((a,b)=>a.x-b.x);r.text=joinIts(r.its)});
  return rows;
}
function joinIts(its){let out='',end=null;for(const t of its){if(end!==null)out+=(t.x-end>14)?' | ':' ';out+=t.s;end=t.x+(t.w||0)}return out}

  const out={competenceType:'',competence:'',theme:'',themeNo:'',leconNo:'',titre:'',classe:'',nbSeances:0,nbSeancesLu:false,capacites:[]};
  let m=/comp[ée]tences?\s*(de\s+base|terminales?)?\s*\d*[ \t]*[:：\-–][ \t]*([^\n]+(?:\n(?!\s*(?:th[èe]me|le[cç]on|s[ée]ances?|dur[ée]e|supports?|pr[ée]requis|capacit|place))[^\n]+)*)/i.exec(metaText);
  if(m){out.competence=clean(m[2]);out.competenceType=/base/i.test(m[1]||'')?'base':/terminal/i.test(m[1]||'')?'terminale':''}

  const cand=[];
  for(const rw of body){const its=rw.its;let best=0,bx=null;for(let k=1;k<its.length;k++){const g=its[k].x-(its[k-1].x+(its[k-1].w||0));if(g>best){best=g;bx=its[k].x}}if(best>18&&bx!==null)cand.push(Math.round(bx/4)*4)}

    if(/capacit/i.test(r.text)&&/contenu/i.test(r.text)&&r.text.length<45) continue;

/* =========================================================
   Balisage léger : **gras**  *italique*  __souligné__  $formule$  [[blue:texte]] [[red:..]] [[box:..]]
   ========================================================= */
const TOK=/(\$[^$\n]+\$)|(\*\*\*(?!\s)[\s\S]+?\*\*\*)|(\*\*(?!\s)[\s\S]+?\*\*)|(__(?!\s)[\s\S]+?__)|(\*(?!\s)[^*\n]*[^*\s]\*)|(\[\[(?:blue|red|green|box):[\s\S]*?\]\])/;
function parseInline(s,st){
  st=st||{}; const out=[]; let rest=String(s??'');
  while(rest){
    const m=TOK.exec(rest);
    if(!m){out.push(Object.assign({text:rest},st));break}
    if(m.index>0) out.push(Object.assign({text:rest.slice(0,m.index)},st));
    if(m[1]) out.push(Object.assign({math:m[1].slice(1,-1)},st));
    else if(m[2]) out.push(...parseInline(m[2].slice(3,-3),Object.assign({},st,{b:true,i:true})));
    else if(m[3]) out.push(...parseInline(m[3].slice(2,-2),Object.assign({},st,{b:true})));
    else if(m[4]) out.push(...parseInline(m[4].slice(2,-2),Object.assign({},st,{u:true})));
    else if(m[5]) out.push(...parseInline(m[5].slice(1,-1),Object.assign({},st,{i:true})));
    else if(m[6]){
      const mm=/^\[\[(blue|red|green|box):([\s\S]*)\]\]$/.exec(m[6]);
      const d=mm[1]==='box'?{box:true}:{color:mm[1]};
      out.push(...parseInline(mm[2],Object.assign({},st,d)));
    }
    rest=rest.slice(m.index+m[0].length);
  }
  return out;
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={blue:'#0070c0',red:'#c00000',green:'#1a7f4b'};
function runsHTML(s,base){
  return parseInline(s,base||{}).map(r=>{

    if(r.math!==undefined){
      try{h=katex.renderToString('\\displaystyle '+r.math,{throwOnError:false,output:'html'})}catch(e){h=esc(r.math)}
    } else h=esc(r.text);
    const css=[]; if(r.b)css.push('font-weight:700'); if(r.i)css.push('font-style:italic'); if(r.color)css.push('color:'+COL[r.color]);
    if(r.u) h='<u>'+h+'</u>';
    if(r.box) h='<span class="box">'+h+'</span>';
    return css.length?'<span style="'+css.join(';')+'">'+h+'</span>':h;
  }).join('');
}

/* =========================================================
   Pagination (A4) : découpe les blocs et les lignes de tableau
   ========================================================= */
const PAGE_H=1123,CONTENT_H=1123-36-68;
function lhOf(k){return (!k||k>=.95)?1.27:(k>=.85?1.2:1.14)}
const cellLen=c=>(c.lines||[]).reduce((a,x)=>a+String(x).length+30,0);
function rowSplittable(r){return !!(r.cells&&r.cells.length&&r.cells.every(c=>!c.img&&!c.sub&&!(c.rs>1)&&!c.vm)&&r.cells.some(c=>cellLen(c)>=260))}
function cutLine(s,off){
  const ok=i=>{const p=s.slice(0,i);return (p.split('$').length-1)%2===0&&((p.match(/\*\*/g)||[]).length%2===0)&&((p.match(/\[\[/g)||[]).length===(p.match(/\]\]/g)||[]).length)};
  for(let d=0;d<s.length;d++){for(const i of [off-d,off+d]){if(i>8&&i<s.length-8&&s[i]===' '&&ok(i)) return i}}
  return -1;

function splitCell(c,t){
  const L=(c.lines||[]).map(String),w=L.map(x=>x.length+30),tot=w.reduce((a,x)=>a+x,0);
  if(tot<260) return null;
  const target=tot*t;let acc=0,idx=0;
  while(idx<L.length-1&&acc+w[idx]<=target){acc+=w[idx];idx++}
  const off=Math.round(target-acc-15),line=L[idx],head=L.slice(0,idx),tail=L.slice(idx+1);
  if(off>20&&off<line.length-20){
    const k=cutLine(line,off);
    if(k>0){head.push(line.slice(0,k).trimEnd());tail.unshift(line.slice(k+1).trimStart())}

  }else if(off<=20) tail.unshift(line); else head.push(line);

  return [Object.assign({},c,{lines:head}),Object.assign({},c,{lines:tail})];

function splitRowFit(b,r,room,M){
  const mr=rr=>{M.innerHTML=tblHTML(b,[rr],false);const tr=M.querySelector('tr');return tr?tr.getBoundingClientRect().height:0};
  const build=t=>{const a=[],z=[];let any=false;
    for(const c of r.cells){const sp=splitCell(c,t);
      if(sp){any=true;a.push(sp[0]);z.push(sp[1])}
      else{a.push(c);z.push(Object.assign({},c,{lines:['']}))}}
    return any?[Object.assign({},r,{cells:a,bb:false}),Object.assign({},r,{cells:z,bt:false})]:null};
  let lo=.05,hi=.95,best=null;
  for(let it=0;it<8;it++){const mid=(lo+hi)/2,parts=build(mid);
    if(!parts){hi=mid;continue}
    if(mr(parts[0])<=room-1){best=parts;lo=mid}else hi=mid}
  if(!best) return null;
  return [{row:best[0],h:mr(best[0])},{row:best[1],h:mr(best[1])}];
}
function paginate(doc,k){
  const M=document.getElementById('measure'); M.style.setProperty('--k',k||1); M.style.setProperty('--lh',lhOf(k));
  const meas=doc.map(b=>{
    if(b.t==='tbl'){
      M.innerHTML=tblHTML(b,b.rows,true);
      const trs=[...M.querySelectorAll('tr')].map(t=>t.getBoundingClientRect().height);
      const hh=trs.slice(0,b.head.length).reduce((a,x)=>a+x,0);
      const gap=b.gap??8;
      return {headH:hh,rowH:trs.slice(b.head.length),gap};
    }
    M.innerHTML=blockHTML(b);
    return {h:M.firstElementChild.getBoundingClientRect().height};
  });
  M.innerHTML='';
  const pages=[[]]; let used=0, corr=null;
  const np=()=>{pages.push([]);used=0};
  const cur=()=>pages[pages.length-1];
  const firstPiece=(j)=>{const b=doc[j],m=meas[j]; if(!b)return 0;
    if(b.t==='tbl') return m.headH+(m.rowH[0]||0)+(b.rows[0]&&b.rows[0].keep?(m.rowH[1]||0):0);
    return m.h};
  doc.forEach((b,bi)=>{
    const m=meas[bi];
    if(b.pb){if(used>0) np(); corr=pages.length-1}
    if(b.t!=='tbl'){
      if(b.lines&&b.lines.every(x=>!String(x).trim())&&(used===0||used+m.h>CONTENT_H)) return;
      let need=m.h; if(b.keep){let j=bi+1;while(doc[j]&&doc[j].keep&&doc[j].t!=='tbl'){need+=meas[j].h;j++}need+=firstPiece(j)}
      if(used+need>CONTENT_H&&used>0) np();
      cur().push({html:blockHTML(b)}); used+=m.h; return;
    }
    const rows=b.rows.slice(), rowH=m.rowH.slice();
    let chunk=null;
    for(let i=0;i<rows.length;){
      let e=i; while(rows[e].grp&&rows[e+1]&&rows[e+1].grp===rows[e].grp) e++;
      let h=0; for(let k=i;k<=e;k++) h+=rowH[k];
      const kp=(rows[e].keep&&e+1<rows.length)?(rowSplittable(rows[e+1])?Math.min(rowH[e+1],80):rowH[e+1]):0;
      let need=h+kp+(chunk?0:m.headH);
      if(i===e&&!kp&&used+need>CONTENT_H){
        const room=CONTENT_H-used-(chunk?0:m.headH);
        if(room>=60&&rowSplittable(rows[i])){
          const sp=splitRowFit(b,rows[i],room,M);
          if(sp){rows.splice(i,1,sp[0].row,sp[1].row);rowH.splice(i,1,sp[0].h,sp[1].h);h=rowH[i];need=h+(chunk?0:m.headH)}
        }
      }
      if(used+need>CONTENT_H&&used>0){np();chunk=null;need=h+kp+m.headH}
      if(!chunk){chunk={b,rows:[]};cur().push(chunk);used+=m.headH}
      for(let k=i;k<=e;k++) chunk.rows.push(rows[k]); used+=h;
      i=e+1;
    }
    used+=m.gap;
  });
  const outP=pages.filter(p=>p.length).map(p=>p.map(x=>x.html||tblHTML(x.b,x.rows,true)).join(''));
  if(corr!==null) outP.corr=pages.slice(0,corr).filter(p=>p.length).length;
  return outP;
}
/* Épreuve : pages numérotées « Page 1 sur n » ; corrigé type : numérotation à part, pour que l’élève ne croie pas qu’il manque des pages */
function pgLabel(pages,i,f){
  const c=(f&&f.__exam&&typeof pages.corr==='number'&&pages.corr>0)?pages.corr:null;
  if(c===null) return 'Page '+(i+1)+' sur '+pages.length;
  return i<c?'Page '+(i+1)+' sur '+c:'Corrigé type : page '+(i-c+1)+' sur '+(pages.length-c);
}
function footerLeft(f){
  if(f.__exam){const w=[f.prenom,(f.nom||'').toUpperCase()].filter(Boolean).join(' ');return {who:w,rest:(f.examTitle||'Épreuve')+' - '+discLabel(f)+(has(f.classe)?' '+f.classe:'')+' ',titre:''}}
  const who=[f.prenom,(f.nom||'').toUpperCase()].filter(Boolean).join(' ');
  return {who, rest:discLabel(f)+(has(f.classe)?' '+f.classe:'')+(has(f.leconNo)||has(f.titre)?' - Leçon'+(has(f.leconNo)?' '+f.leconNo:'')+' :':'')+' ', titre:has(f.titre)?(f.titre.charAt(0)+f.titre.slice(1).toLowerCase()):''};
}
function pagesHTML(f,pages,k){
  const fl=footerLeft(f);

/* =========================================================
   LaTeX -> équations Word (sous-ensemble)
   ========================================================= */
const SYM={times:'×',div:'÷',approx:'≈',neq:'≠',ne:'≠',leq:'≤',le:'≤',geq:'≥',ge:'≥',Rightarrow:'⇒',Leftrightarrow:'⇔',rightarrow:'→',to:'→',parallel:'∥',perp:'⟂',in:'∈',notin:'∉',subset:'⊂',cup:'∪',cap:'∩',pi:'π',alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',lambda:'λ',mu:'μ',omega:'ω',Omega:'Ω',Delta:'Δ',circ:'∘',degree:'°',cdot:'·',ldots:'…',dots:'…',cdots:'⋯',infty:'∞',sim:'∼',pm:'±',equiv:'≡',emptyset:'∅',forall:'∀',exists:'∃',angle:'∠',triangle:'△',lt:'<',gt:'>',ell:'ℓ',Omega_:'Ω',therefore:'∴',mid:'∣',ohm:'Ω'};
const BB={Q:'ℚ',N:'ℕ',Z:'ℤ',D:'𝔻',R:'ℝ',C:'ℂ'};
function texToDocx(tex){
  const D=window.docx; let i=0;
  const run=t=>new D.MathRun(t);
  function readArg(){
    while(tex[i]===' ')i++;
    if(tex[i]==='{'){i++;const n=seq('}');i++;return n.length?n:[run('')]}
    if(tex[i]==='\\'){const n=command();return n.length?n:[run('')]}
    const ch=tex[i++]||'';return [run(ch)];
  }
  function rawGroup(){while(tex[i]===' ')i++; if(tex[i]!=='{'){return tex[i++]||''} let d=0,s='';i++;while(i<tex.length){const c=tex[i];if(c==='{')d++;if(c==='}'){if(d===0)break;d--} s+=c;i++}i++;return s}
  function command(){
    i++; let name=''; while(i<tex.length&&/[a-zA-Z]/.test(tex[i])) name+=tex[i++];
    if(!name){const c=tex[i++]||''; return (c===','||c===';'||c===':'||c==='!'||c===' ')?[run(' ')]:[run(c)];}
    if(name==='frac'||name==='dfrac'||name==='tfrac'){const n=readArg(),d=readArg();return [new D.MathFraction({numerator:n,denominator:d})]}
    if(name==='sqrt'){ if(tex[i]==='['){const j=tex.indexOf(']',i);i=j+1} const a=readArg();return [new D.MathRadical({children:a})]}
    if(name==='text'||name==='mathrm'||name==='mathbf'||name==='textbf'||name==='operatorname'){return [run(rawGroup())]}
    if(name==='mathbb'){const g=rawGroup();return [run(BB[g]||g)]}
    if(name==='left'||name==='right'||name==='displaystyle'||name==='limits'||name==='big'||name==='Big') return [];
    if(name==='quad'||name==='qquad') return [run('  ')];
    if(name==='overrightarrow'||name==='vec'){return [run(rawGroup()+'⃗')]}
    if(name==='widehat'||name==='hat'){return [run(rawGroup()+'̂')]}
    if(name==='overline'){return [run(rawGroup()+'̅')]}
    if(name==='lbrace')return [run('{')]; if(name==='rbrace')return [run('}')];
    if(SYM[name]) return [run(SYM[name])];
    return [run(name)];
  }
  function seq(end){
    const nodes=[];let buf='';
    const flush=()=>{if(buf){nodes.push(run(buf));buf=''}};
    while(i<tex.length){
      const c=tex[i];
      if(end&&c===end)break;
      if(c==='{'){i++;flush();nodes.push(...seq('}'));i++;continue}
      if(c==='^'||c==='_'){
        i++;const arg=readArg();let base;
        if(buf){const last=buf.slice(-1);buf=buf.slice(0,-1);flush();base=[run(last)]}
        else base=nodes.length?[nodes.pop()]:[run('')];
        nodes.push(c==='^'?new D.MathSuperScript({children:base,superScript:arg}):new D.MathSubScript({children:base,subScript:arg}));
        continue;
      }
      if(c==='\\'){flush();nodes.push(...command());continue}
      if(c===' '){flush();i++;continue}
      buf+=c;i++;
    }
    flush();return nodes;
  }
  const n=seq(null);
  return n;
}

    else if(b.t==='img'){children.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:b.img.credit?0:120},children:[imgRun(b.img)]}));if(b.img.credit)children.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:120},children:[new D.TextRun({text:(/^(Sch|Repr)/.test(b.img.credit)?'':'Source : ')+b.img.credit,italics:true,size:18,font:'Bookman Old Style'})]}))}

  p.ms=p.n?Math.round(p.ms*0.6+ms*0.4):ms; p.n++; if(!ok) p.bad++; p.t=Date.now(); DB.ai.perf[model]=p; save();
}
async function gemModels(key){
  // Toujours consulter le catalogue Google et privilégier les modèles Flash récents.
  // Un ancien modèle mémorisé ne doit pas bloquer la rédaction s'il est encore listé
  // mais ne répond plus correctement pour ce projet.
  const saved=String(DB.ai&&DB.ai.model||'').trim();
  if(!GEM.list||!GEM.list.length||Date.now()-GEM.listAt>3600e3){GEM.list=await geminiModelList(key);GEM.listAt=Date.now()}
  const available=GEM.list.filter(n=>!(GEM.dead[n]>Date.now()));
  if(saved&&available.includes(saved)) glog('modèle enregistré '+saved+' : le catalogue actuel est privilégié pour éviter un modèle lent ou indisponible');
  /* Ordre : 1) modèles déjà éprouvés sur vos clés et rapides (le plus rapide d'abord) ; 2) modèles pas encore essayés (récents d'abord, comme le catalogue) ; 3) modèles lents ou souvent en échec. Un modèle « introuvable » est déjà écarté ci-dessus. */
  const perf=(DB.ai&&DB.ai.perf)||{}, fresh=n=>perf[n]&&Date.now()-perf[n].t<14*864e5;
  const cls=n=>!fresh(n)?1:((perf[n].ms<=70000&&perf[n].bad<=perf[n].n/2)?0:2);
  const sorted=available.slice().sort((a,b)=>cls(a)-cls(b)||(cls(a)===0?perf[a].ms-perf[b].ms:0));
  glog('modèles retenus : '+sorted.slice(0,3).map(n=>n+(fresh(n)?' ('+Math.round(perf[n].ms/1000)+' s)':'')).join(', '));
  return sorted.slice(0,3);
}
function fixJsonText(t){
  return String(t)
    .replace(/(?<!\\)\\(?=(?:dfrac|frac|tfrac|times|textbf|textit|text|theta|triangle|to|beta|bar|begin|binom|neq|nabla|notin|rightarrow|right|rho|forall|boldsymbol)(?![a-z]))/g,'\\\\')
    .replace(/(?<!\\)\\(?!["\\\/bfnrt]|u[0-9a-fA-F]{4})/g,'\\\\');
}
function cleanMath(v){
  if(typeof v!=='string') return v;
  let t=v.replace(/√\s*\(([^()]+)\)/g,'\\sqrt{$1}').replace(/√\s*([A-Za-z0-9]+)/g,'\\sqrt{$1}').replace(/\b vecteur\s+([A-Z])\s*([A-Z])\b/gi,'\\overrightarrow{$1$2}').replace(/\u000crac/g,'\\frac').replace(/\u0009imes/g,'\\times').replace(/\u0009ext\{/g,'\\text{').replace(/\u0009heta/g,'\\theta').replace(/\u0008eta/g,'\\beta').replace(/\u000dight/g,'\\right')
    .replace(/(?<![\\a-zA-Z])(d?frac)\{/g,'\\$1{');
  return t.split('\n').map(line=>line.split(/(\$[^$\n]+\$)/).map((seg,i)=>i%2?seg:seg.replace(/\\d?frac\{[^{}]+\}\{[^{}]+\}|\\sqrt\{[^{}]+\}|\\text\{[^{}]+\}|\\(?:times|cdot|div|pm|leq|geq|neq|approx|pi|alpha|beta|theta|Delta|infty|rightarrow|Rightarrow)(?![a-zA-Z])/g,m=>'$'+m+'$')).join('')).join('\n');
}
function cleanDeep(o){
  if(typeof o==='string') return cleanMath(o);
  if(Array.isArray(o)) return o.map(cleanDeep);
  if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=cleanDeep(o[k]);return r}
  return o;
}

/* ---------- Claude par clé API Anthropic (appel direct depuis le navigateur) ---------- */
async function anthropicCheck(r,model){
  if(r.ok) return r.json();
  let raw='',msg='';
  try{raw=await r.text();const j=JSON.parse(raw);msg=(j.error&&j.error.message)||''}catch(e){}
  const e={code:'http_'+r.status,raw,message:msg||('Erreur Claude ('+r.status+')')};
  if(r.status===401) {e.code='fatal';e.message='Clé Claude invalide. Vérifiez qu’elle est copiée en entier (elle commence par sk-ant-).'}
  else if(r.status===403) {e.code='fatal';e.message='Clé Claude refusée pour ce service. '+msg}
  else if(r.status===404) {e.code='fatal';e.message='Le modèle « '+model+' » est introuvable avec cette clé. Corrigez le nom du modèle dans Réglages.'}
  else if(r.status===400&&/credit balance|billing|plans? & billing/i.test(msg)) {e.code='fatal';e.message='Le crédit de votre compte Anthropic est épuisé ou absent. Ajoutez du crédit sur console.anthropic.com (Billing), puis recommencez : ce qui est déjà rédigé est conservé.'}
  else if(r.status===429) {e.code='rate_limited';e.message='Limite de requêtes Claude atteinte. Patientez une minute puis recommencez : ce qui est déjà rédigé est conservé.'}
  else if(r.status===529||r.status>=500) {e.code='service_busy';e.message='Les serveurs de Claude sont momentanément surchargés (erreur '+r.status+'). Réessayez dans un instant.'}
  throw e;
}

  const mx=(src,rad)=>{const out=new Float32Array(src.length);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){let m=0;for(let yy=Math.max(0,y-rad);yy<=Math.min(gh-1,y+rad);yy++)for(let xx=Math.max(0,x-rad);xx<=Math.min(gw-1,x+rad);xx++){const v=src[yy*gw+xx];if(v>m)m=v}out[y*gw+x]=m}return out};

      const b=(bg[y0*gw+x0]*(1-tx)+bg[y0*gw+x1]*tx)*(1-ty)+(bg[y1*gw+x0]*(1-tx)+bg[y1*gw+x1]*tx)*ty;

async function ocrItems(file){
  const job=OCR_Q.then(async()=>{
    const worker=await ocrWorker();
    setGen('Amélioration de l’image (éclairage, contraste, traits du tableau)…');
    const bin=await ocrPrep(file,'bin');
    let items=await ocrOnce(worker,bin,6);
    const good=it=>{try{return localData(it).capacites.length>0}catch(e){return false}};
    if(!good(items)){
      /* seconde chance : image en niveaux de gris et segmentation automatique de la page */
      setGen('Seconde lecture de la photo avec un autre réglage…');
      const gray=await ocrPrep(file,'gray');
      const alt=await ocrOnce(worker,gray,3);
      if(good(alt)||alt.length>items.length) items=alt;
    }
    return items;
  });
  OCR_Q=job.catch(()=>{});
  return job;
}

const GEO_DOC='FORMAT D’UNE FIGURE (objet JSON, tracé exactement par l’application) : {"points":{"A":[0,0],"B":[4,0],"C":[0,3]},"polygones":[["A","B","C"]],"segments":[["A","B"],{"p":["B","C"],"label":"5 cm","tirets":false,"trait":1}],"droites":[{"p":["A","B"],"label":"(d)"}],"cercles":[{"c":"O","r":2,"label":"(C)"}],"anglesDroits":[["B","A","C"]],"angles":[{"p":["B","A","C"],"label":"35°"}],"textes":[{"x":1,"y":2,"t":"texte"}]}. Les coordonnées sont en cm, y vers le HAUT, et respectent EXACTEMENT les données (longueurs, angles droits, milieux, parallèles, symétries ; ex. ABC rectangle en A avec AB = 3 et AC = 4 : A [0,0], B [3,0], C [0,4]). Les points portent le nom de leur lettre (A, B, A’ …) ; un nom commençant par _ n’est pas écrit. « anglesDroits » et « angles » : [point, sommet, point]. « segments » : paires ou objets {p, label (longueur à écrire), tirets (true = pointillés), trait (1 à 3 petits traits pour les segments de même longueur)}. « droites » sont prolongées de part et d’autre. « cercles » : c = nom du centre, r = rayon (ou « passePar » = nom d’un point). CONSTRUCTIONS CALCULÉES PAR L’APPLICATION (à utiliser au lieu de calculer toi-même les coordonnées) : ajoute « construire » = liste appliquée dans l’ordre, après « points » ; chaque étape crée un point : {"milieu":"I","de":["A","B"]} ; {"sym":"A’","de":"A","axe":["B","C"]} (symétrique par rapport à la droite (BC)) ; {"symC":"A’","de":"A","centre":"O"} (symétrique par rapport au point O) ; {"proj":"H","de":"A","sur":["B","C"]} (pied de la perpendiculaire) ; {"inter":"I","droites":[["A","B"],["C","D"]]} (intersection) ; {"parallelogramme":"D","de":["A","B","C"]} (ABCD parallélogramme) ; {"transl":"A’","de":"A","vecteur":["B","C"]} (translation du vecteur BC) ; {"rot":"B’","de":"B","centre":"O","angle":90} (rotation de centre O, sens inverse des aiguilles d’une montre) ; {"nom":"M","sur":["A","B"],"t":0.4} (point M de [AB] avec AM = t × AB, pour Thalès). Tous les points utilisés doivent exister avant l’étape. Pour un triangle et ses symétriques, donne seulement le triangle de départ et l’axe ou le centre dans « points », puis les étapes « construire ». « demiDroites » : [{"p":["A","B"]}] (demi-droite [AB) prolongée au-delà de B). REPÈRE ORTHONORMÉ (coordonnées, fonctions affines, translations dans un repère) : ajoute "repere":{"xmin":-4,"xmax":6,"ymin":-3,"ymax":5,"pas":1,"grille":true,"coordonnees":false} ; les points, segments, droites, polygones sont alors donnés par leurs coordonnées dans ce repère (une droite d’équation y = ax + b : deux points de la droite, ex. [0,b] et [1,a+b]) ; "coordonnees":true écrit A(x ; y) à côté des points (corrigé seulement). DROITE GRADUÉE, DEMI-DROITE GRADUÉE ou AXE (nombres relatifs, abscisses, fractions, décimaux) : utilise {"droiteGraduee":{"min":-3,"max":5,"pas":1,"sous":2,"demi":"droite","origine":true,"points":{"A":2.5,"B":-1},"abscisses":false,"masque":[2,3]}} où « min » et « max » sont les valeurs des extrémités, « pas » l’écart entre deux graduations numérotées, « sous » le nombre de subdivisions par pas (2 = demi-graduations, 10 = dixièmes), « demi » = "droite" (demi-droite graduée vers la droite, départ à « min ») ou "gauche", à omettre pour une droite complète, « origine » écrit O au-dessus de 0, « points » = nom → abscisse (un nom commençant par _ n’est pas écrit), « abscisses »:true écrit l’abscisse à côté du nom, « masque » liste les valeurs dont le nombre n’est pas écrit, « etiq »:"aucune" n’écrit aucun nombre. Dans l’énoncé où l’élève doit placer des points, ne mets PAS « points » (ou mets les points à lire sans leur abscisse) ; dans le corrigé, ajoute les points placés. Cette forme remplace toute autre clé (n’y mets ni « points » de géométrie ni « segments »). La figure d’un énoncé ne montre JAMAIS la réponse ; celle d’un corrigé montre en plus la construction ou le résultat.';

async function eprFigOf(spec,dw){

function eprPickFocus(items,last,score){
  score=score||(()=>0);
  if(items.length<2) return {pair:items.slice(),key:''};
  const multi=new Set(items.map(x=>x.les)).size>1;
  let a,b,key='';
  for(let t=0;t<14;t++){
    const jit=.2+t*.4;
    const rank=arr=>arr.map(x=>({x,s:score(x)+Math.random()*jit})).sort((p,q)=>p.s-q.s).map(o=>o.x);
    a=rank(items)[0];
    let pool=items.filter(x=>x!==a&&(!multi||x.les!==a.les));
    if(!pool.length) pool=items.filter(x=>x!==a);
    b=rank(pool)[0];
    key=[a.idx,b.idx].sort((x,y)=>x-y).join('-');
    if(key!==last) break;
  }
  return {pair:[a,b],key};
}

/* ---------- corrections : rapides, ciblées, avec compteur et bouton Arrêter ---------- */
async function corrAsk(prompt,stEl,label){
  const cancel={stop:false}, t0=Date.now();
  const btn=document.createElement('button'); btn.type='button'; btn.className='btn alt sm'; btn.textContent='Arrêter'; btn.style.marginLeft='8px';
  const tick=()=>{if(stEl){stEl.textContent=label+' '+Math.round((Date.now()-t0)/1000)+' s';stEl.className='status muted'}};
  if(stEl&&stEl.parentNode) stEl.parentNode.insertBefore(btn,stEl.nextSibling);
  const iv=setInterval(tick,1000); tick();
  let hardT;
  const stopP=new Promise((_,rj)=>{btn.onclick=()=>{cancel.stop=true;rj({code:'cancelled',message:'Arrêté.'})}});
  const hardP=new Promise((_,rj)=>{hardT=setTimeout(()=>{cancel.stop=true;rj({code:'fatal',message:'C’est trop long (plus de 100 secondes) : rien n’a été modifié. Réessayez, ou précisez la partie à corriger pour une réponse plus rapide.'})},100000)});
  try{return await Promise.race([ask(prompt,{fast:true,cancel}),stopP,hardP])}
  finally{clearInterval(iv);clearTimeout(hardT);btn.remove()}
}
function eprScope(ins){
  const t=' '+String(ins||'').toLowerCase()+' ', S=new Set(), add=(...k)=>k.forEach(x=>S.add(x));
  if(/situation|contexte/.test(t)) add('situation','corrSit');
  if(/consigne/.test(t)) add('consignes','corrSit');
  if(/exercice\s*2|objectives?|vrai|faux|qcm|choisis|relie|relier|r[ée]arrange|compl[èe]te/.test(t)) add('ex2');
  if(/exercice\s*3|traditionnelles?/.test(t)) add('ex3');
  if(/grille|bar[èe]me|crit[èe]re|indicateur/.test(t)) add('grille');
  if(/corrig/.test(t)) add('corrSit','ex2','ex3');
  return S.size?S:null;
}
function ficheScope(ins){
  const t=' '+String(ins||'').toLowerCase()+' ', S=new Set(), add=(...k)=>k.forEach(x=>S.add(x));
  if(/situation|contexte/.test(t)) add('situation');
  if(/r[ée]solution|trace\s+[ée]crite/.test(t)) add('resolution','trace');
  if(/consigne/.test(t)) add('consignes');
  if(/synth[èe]se/.test(t)) add('synthese');
  if(/essentiel|retenir|r[ée]cap/.test(t)) add('essentiel','recap');
  if(/application/.test(t)) add('exoApp','exoAppSol');
  if(/maison/.test(t)) add('exoMaison','exoMaisonSol');
  if(/exercice/.test(t)&&!/application|maison/.test(t)) add('exoApp','exoAppSol','exoMaison','exoMaisonSol','evalQ','evalR');
  if(/[ée]valuation|question/.test(t)) add('evalQ','evalR');
  if(/corrig|solution|r[ée]ponse/.test(t)) add('correction','exoAppSol','exoMaisonSol','evalR');
  if(/capacit[ée]/.test(t)) add('capTitre');
  if(/activit|d[ée]roulement|professeur|\bprof\b|[ée]l[èe]ve|moment|phase|dialogue/.test(t)) add('@m');
  return S.size?S:null;
}

const CORR_KEYS=['capTitre','contenus','situation','resolution','synthese','essentiel','exoApp','exoAppSol','exoMaison','exoMaisonSol','correction','consignes','trace','evalQ','evalR','recap'];
async function applyCorrection(i){
  if(REC){try{REC.stop()}catch(e){}}
  const f=F(),s=f.seances[i],st=document.getElementById('ai-'+i),ta=document.getElementById('corr-'+i);
  const say=(t,err)=>{flash(t,err);if(st){st.textContent=t;st.className='status'+(err?' err':'')}};
  const ins=((ta&&ta.value)||'').trim();
  if(!ins){say('Écrivez ou dictez d’abord l’instruction.',true);return}
  if(!aiKind()){say(NO_AI,true);return}
  const all={};
  for(const k of CORR_KEYS) if(has(s[k])) all[k]=String(s[k]);
  for(const k in (s.m||{})){const m=s.m[k]; if(has(m.prof)) all['m.'+k+'.prof']=String(m.prof); if(has(m.eleve)) all['m.'+k+'.eleve']=String(m.eleve)}
  const attempt=async(sc)=>{
    const cur={}; for(const k in all){ if(!sc||sc.has(k)||(sc.has('@m')&&k.startsWith('m.'))) cur[k]=all[k] }
    const prompt='Tu aides un enseignant du Togo à corriger une séance de sa fiche pédagogique ('+discLabel(f)+', classe '+(f.classe||'collège')+', leçon « '+(f.titre||'')+' »).\n'+
      'Voici '+(sc?'les parties concernées de la séance':'le contenu actuel de la séance')+' sous forme d’objet JSON (clé → texte) :\n'+JSON.stringify(cur)+'\n\n'+
      'INSTRUCTION DE L’ENSEIGNANT : « '+ins+' »\n\n'+
      'Capacité de la séance : '+(s.capTitre||'')+'\nContenus enseignés dans cette séance : '+(s.contenus||'')+'\n\n'+
      (sc?'Applique l’instruction à ces parties, rapidement, sans réécrire ce qui n’est pas demandé. ':'Applique cette instruction aux parties concernées de la séance, même si elle est générale (par exemple « reviens aux contenus », « c’est trop difficile », « hors niveau ») : repère ce qui dépasse les contenus ou le niveau de la classe et simplifie-le. ')+
      'Ne demande JAMAIS de précision : fais la modification la plus raisonnable. Réponds par un objet JSON qui contient SEULEMENT les clés à modifier (mêmes noms de clés), chacune avec son texte complet corrigé. N’inclus pas les clés inchangées. Conserve le balisage existant (**gras**, __souligné__, formules $...$ en LaTeX, [[blue:texte]], retours à la ligne \\n). Ne change rien d’autre. Si l’instruction ne concerne aucun texte, réponds {}.';
    const r=await corrAsk(prompt,st,sc?'Application de l’instruction…':'Application de l’instruction à toute la séance…');
    let n=0;
    if(r&&typeof r==='object') for(const k in r){
      const v=r[k]; if(typeof v!=='string') continue;
      const mm=/^m\.(\w+)\.(prof|eleve)$/.exec(k);
      if(mm&&s.m&&s.m[mm[1]]){s.m[mm[1]][mm[2]]=v;n++}
      else if(CORR_KEYS.includes(k)){s[k]=v;n++}
    }
    return n;
  };
  try{
    const sc=ficheScope(ins);
    const wantsFig=/trac[eéèêa]|dessin|figure|sch[ée]ma|gradu|abscisse|\baxe\b/i.test(ins);
    let n=0;
    if(wantsFig){
      try{const ims=await genCourseFigures(f,i,ins,p=>corrAsk(p,st,'Tracé de la figure…'));
        if(ims.length){ if(/remplace|refai|recommenc|corrige la figure|change la figure/i.test(ins)) s.figs=ims; else s.figs=(Array.isArray(s.figs)?s.figs:[]).concat(ims); n+=ims.length }}
      catch(e){if(e&&(e.code==='cancelled'||e.code==='rate_limited'||e.code==='not_granted'||e.code==='fatal'))throw e}
    }
    if(!(wantsFig&&!sc)){
      n+=await attempt(sc);
      if(!n&&sc) n+=await attempt(null);      // ciblage manqué : on relit toute la séance
    }
    touch();
    if(!n){say('Rien n’a été modifié : reformulez l’instruction en précisant la partie concernée.',true);return}
    openSeances.add(i);render2();
    const st2=document.getElementById('ai-'+i); if(st2){st2.textContent='Instruction appliquée ('+n+' partie(s) modifiée(s)). Relisez le résultat.';st2.className='status'}
  }catch(e){say(errCopy(e),true)}
}
let REC=null;
function toggleMic(i,btn){
  const ta=document.getElementById('corr-'+i),st=document.getElementById('ai-'+i);
  const say=(t,err)=>{flash(t,err);if(st){st.textContent=t;st.className='status'+(err?' err':'')}};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('La dictée n’est pas disponible dans ce navigateur : appuyez dans la case puis utilisez l’icône micro du clavier de votre téléphone.',true);return}
  if(!ta) return;
  if(REC){const r0=REC; try{r0.stop()}catch(e){} setTimeout(()=>{if(REC===r0){try{r0.abort()}catch(e){} REC=null;if(btn)btn.textContent='🎤 Dicter';flash('')}},1500); return}
  const r=new SR(); r.lang='fr-FR'; r.interimResults=true; r.continuous=true;
  const base=ta.value.trim(); let heard='', got=false;
  const put=txt=>{ta.value=((base?base+' ':'')+txt).replace(/\s+/g,' ').trim();ta.dispatchEvent(new Event('input',{bubbles:true}))};
  /* Certains navigateurs mobiles renvoient, à chaque événement, tout le texte déjà dit (parfois plusieurs fois) :
     on reconstruit donc le texte complet à chaque fois, sans jamais l'additionner. */
  const lc=x=>x.toLowerCase().replace(/[.,;!?]/g,'').replace(/\s+/g,' ').trim();
  const rebuild=ev=>{
    const segs=[];
    for(let k=0;k<ev.results.length;k++){
      const t=String(ev.results[k][0].transcript||'').trim(); if(!t) continue;
      const last=segs.length?segs[segs.length-1]:null;
      if(last&&lc(t).startsWith(lc(last))) segs[segs.length-1]=t;       // version plus longue du même segment
      else if(last&&lc(last).startsWith(lc(t))) continue;               // répétition plus courte : ignorée
      else if(last&&lc(last)===lc(t)) continue;
      else segs.push(t);
    }
    return segs.join(' ');
  };
  r.onresult=ev=>{got=true;heard=rebuild(ev);put(heard)};
  r.onerror=ev=>{
    if(ev.error==='no-speech'||ev.error==='aborted') return;
    say(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Le micro est refusé : autorisez-le dans le navigateur, ou utilisez l’icône micro du clavier.':'Dictée interrompue ('+ev.error+'). Réessayez ou utilisez le micro du clavier.',true);
  };
  r.onend=()=>{
    if(REC===r) REC=null;
    if(btn) btn.textContent='🎤 Dicter';
    if(heard.trim()) put(heard);
    say(got?'Dictée terminée. Relisez le texte puis appuyez sur « Appliquer l’instruction ».':'Aucune parole reconnue. Réessayez en parlant près du micro.');
  };
  try{r.start();REC=r;if(btn)btn.textContent='⏹ Arrêter la dictée';say('Parlez maintenant. Touchez « Arrêter la dictée » quand vous avez fini.')}catch(e){REC=null;say('Impossible de démarrer la dictée.',true)}
}

function setNbSeances(n,f,force){

  return `<div class="tabs" role="tablist">${tabs}</div>${b}${nextBtn}`;

let confirmKey=null,confirmT=null;
function askConfirm(btn,key,run,label){
  if(confirmKey===key){clearTimeout(confirmT);confirmKey=null;run();return}
  confirmKey=key;btn.textContent=label||'Confirmer ?';clearTimeout(confirmT);confirmT=setTimeout(()=>{confirmKey=null;render()},3500);
}
function touch(){const f=F();if(f)f.updated=Date.now();save()}
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pp){DB.profile[t.dataset.pp]=t.value;save();return}
  if(t.dataset.ep){setp(eprInit(),t.dataset.ep,t.value);if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,40)+'px'}save();return}
  if(!t.dataset.p) return;
  const f=F(); let val=t.value;
  if(t.dataset.dureefix){val=val.replace(/ ; /g,'\n')}
  if(t.type==='number'&&t.dataset.p.endsWith('.dw')) val=+val||300;
  setp(f,t.dataset.p,val);
  if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,40)+'px'}
  touch();
});
root.addEventListener('change',e=>{
  const t=e.target,f=F();

async function wikiSearch(i){
  const f=F(),s=f.seances[+i]; const box=document.getElementById('wk-'+i); if(!box)return;
  const q=((document.getElementById('wq-'+i)||{}).value||(s.contenus||'').split(';')[0]||f.titre||'').trim().replace(/^-\s*/,'');

  try{
    const u='https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=4&prop=extracts&exintro=1&explaintext=1&exsentences=4&format=json&origin=*';
    const j=await (await fetch(u)).json();

    if(!pages.length){box.textContent='Aucun résultat. Essayez un autre mot-clé.';return}

  }catch(e){box.textContent='Recherche impossible ici (connexion Internet nécessaire, et non disponible dans la version intégrée à Claude). Ouvrez la version autonome.'}
}
const IMGRES={};
async function runPendingImageSearches(f){
  for(let i=0;i<f.seances.length;i++){
    const s=f.seances[i],field=f.tpl==='A'?'img':'traceImg';
    if(s.autoImgSearch&&s.imgKey){s.autoImgSearch=false;await searchImages(i,field)}
  }
}
const gisReady=()=>!!(DB.ai&&String(DB.ai.gisKey||'').trim()&&String(DB.ai.gisCx||'').trim());
let EPR_IMGS=[];
async function imgSearchAll(q){
  const out=[]; let note='';
  if(gisReady()){
    try{
      const u='https://www.googleapis.com/customsearch/v1?key='+encodeURIComponent(DB.ai.gisKey.trim())+'&cx='+encodeURIComponent(DB.ai.gisCx.trim())+'&q='+encodeURIComponent(q)+'&searchType=image&num=10&safe=active&lr=lang_fr';
      const j=await (await fetch(u)).json();
      if(j&&j.error) throw new Error(j.error.message||'erreur Google');
      for(const it of ((j&&j.items)||[])) out.push({url:it.link,thumb:(it.image&&it.image.thumbnailLink)||it.link,credit:'Google Images — '+(it.displayLink||'source inconnue')+' (vérifiez les droits d’usage)'});
    }catch(e){note='Google Images indisponible ('+(e&&e.message||e)+') : images de Wikimedia à la place. '}
  }
  if(!out.length){
    const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=16&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=1600&format=json&origin=*';
    const j=await (await fetch(u)).json();
    const pages=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&/^image\/(jpeg|png)/.test(p.imageinfo[0].mime||''));
    for(const p of pages){const ii=p.imageinfo[0],m=ii.extmetadata||{};const art=String((m.Artist&&m.Artist.value)||'').replace(/<[^>]*>/g,'').trim();out.push({url:ii.thumburl||ii.url,thumb:ii.thumburl||ii.url,credit:'Wikimedia Commons'+(art?' — '+art:'')+(m.LicenseShortName?' ('+m.LicenseShortName.value+')':'')})}
  }
  return {list:out,note};
}
async function loadImgObj(r){
  for(const u of [r.url,r.thumb].filter(Boolean)){
    try{return await new Promise((res,rej)=>{const x=new Image();x.crossOrigin='anonymous';x.onerror=()=>rej(new Error('x'));x.onload=()=>{try{const sc=Math.min(1,2200/x.width);const c=document.createElement('canvas');c.width=Math.round(x.width*sc);c.height=Math.round(x.height*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(x,0,0,c.width,c.height);res({src:c.toDataURL('image/jpeg',0.94),w:c.width,h:c.height,dw:Math.min(480,c.width),credit:r.credit})}catch(e){rej(e)}};x.src=u})}catch(e){}
  }
  throw new Error('Image inaccessible : le site d’origine refuse la copie. Essayez une autre image, ou enregistrez-la sur votre appareil puis ajoutez-la depuis la galerie.');
}
const imgGridHTML=(list,attr)=>'<div class="row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">'+list.map((r,n)=>'<button type="button" '+attr(n)+' title="'+esc(r.credit)+'" style="border:1px solid var(--line);background:#fff;padding:2px;border-radius:6px;cursor:pointer"><img alt="Résultat '+(n+1)+'" src="'+esc(r.thumb||r.url)+'" style="height:150px;max-width:220px;object-fit:contain;display:block"></button>').join('')+'</div>';
async function searchImages(i,key){
  const f=F(),s=f.seances[+i]; const box=document.getElementById('isr_'+i+'_'+key); if(!box)return;
  const q=(s.imgKey||f.titre||f.theme||'').trim(); if(!q){box.textContent='Saisissez un mot-clé.';return}
  box.textContent='Recherche en cours…';
  try{
    const {list,note}=await imgSearchAll(q);
    if(!list.length){box.textContent=note+'Aucune image trouvée. Essayez un autre mot-clé (en français ou en anglais).';return}
    IMGRES[i+'|'+key]=list;
    box.innerHTML=(note?'<div class="muted small">'+esc(note)+'</div>':'')+imgGridHTML(list,n=>'data-pick="'+i+'|'+key+'|'+n+'"')+'<div class="muted small" style="margin-top:4px">Cliquez sur une image pour l’ajouter à la fiche (la source est indiquée sous l’image).</div>';
  }catch(e){box.textContent='Recherche impossible ici (connexion Internet nécessaire, et non disponible dans la version intégrée à Claude). Ouvrez la version autonome, ou enregistrez une image sur votre appareil.'}
}
async function pickImage(i,key,n){
  const r=(IMGRES[i+'|'+key]||[])[n]; if(!r)return; const f=F();
  try{
    const im=await loadImgObj(r);
    f.seances[+i][key]=im;openSeances.add(+i);touch();render2();
  }catch(e){const box=document.getElementById('isr_'+i+'_'+key);if(box)box.textContent='Impossible de récupérer cette image : '+e.message}
}
function render2(){const y=scrollY;render();scrollTo(0,y)}

function afterRender(){
  document.querySelectorAll('textarea[data-p]').forEach(t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,40)+'px'});
  if(view==='epr') eprAfter();
  if(view==='fiche'&&step===4) buildPreview();
  if(view==='fiche'&&step!==4) setStatus(memOnly?'Non enregistré (navigateur bloqué)':'');
}
async function buildPreview(){
  const f=F(); const box=document.getElementById('sheets'); if(!box)return;
  try{
    await ensureFonts();
    const pages=paginate(buildDoc(f));
    box.innerHTML=pagesHTML(f,pages);
    fitSheets();
  }catch(e){box.innerHTML='<div class="status err">Aperçu impossible : '+esc(e.message||e)+'</div>'}
}
function fitSheets(){
  const box=document.getElementById('sheets'); if(!box)return;
  const w=box.clientWidth-28; const k=Math.min(1,w/794);
  box.querySelectorAll('.paper').forEach(p=>{p.style.zoom=k<1?k:''});
}
window.addEventListener('resize',fitSheets);

/* ---------- démarrage ---------- */
loadDB();
render();
initSample();
</script>
